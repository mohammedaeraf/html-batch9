<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table Demo</title>
    <style>
      body {
        font-family: Arial;
      }
      h2 {
        color: orangered;
        text-align: center;
      }
      table {
        margin: auto;
      }
      table,
      th,
      td {
        border: 1px solid gray;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 4px;
      }
      th {
        color: brown;
      }
    </style>
  </head>
  <body>
    <h2>List of Courses</h2>
    <table>
      <tr>
        <th>Id</th>
        <th>Title</th>
        <th>Duration</th>
        <th>Fee</th>
      </tr>
      <tr>
        <td>AWD</td>
        <td>Advanced Web Design</td>
        <td>2.5 Months</td>
        <td>11,400</td>
      </tr>
      <tr>
        <td>MERN</td>
        <td>Full Stack using MERN</td>
        <td>5 Months</td>
        <td>25,000</td>
      </tr>
      <tr>
        <td>PY</td>
        <td>Python Programming</td>
        <td>1 Month</td>
        <td>7,000</td>
      </tr>
      <tr>
        <td>JV</td>
        <td>Core Java Programming</td>
        <td>1 Month</td>
        <td>7,000</td>
      </tr>
      <tr>
        <td>CNV</td>
        <td>Canva Graphic Design</td>
        <td>1 Months</td>
        <td>7,400</td>
      </tr>
    </table>
  </body>
</html>
