<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML stands for Hyper Text Markup Language</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      h2 {
        text-align: center;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        font-size: 26px;
        color: rgb(21, 98, 34);
        text-shadow: 2px 2px 4px rgb(39, 82, 39);
      }
      p {
        font-family: Roboto, cursive;
        /* border: 2px dotted green; */
        padding: 12px;
        background-color: beige;
        border-radius: 5px;
        box-shadow: 3px 3px 6px gray;
      }
      div {
        text-align: center;
        border: 1px dotted gray;
      }
    </style>
  </head>
  <body>
    <h2>HTML is Fun and Easy</h2>
    <p>
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Similique modi
      corporis nesciunt aperiam porro placeat quo officia! Laboriosam saepe
      praesentium perspiciatis eum consequatur distinctio, corporis non, sed
      dolor animi iste?
    </p>
    <div>
      <img src="img/cat.jpg" width="200px" alt="My Persian Cat" />
    </div>
  </body>
</html>
