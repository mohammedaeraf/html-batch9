<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Query Demo</title>
  <style>

    /* Default style (for all screens) */
    .box {
      width: 300px;
      height: 300px;
      background-color: steelblue;
      margin: 50px auto;
      text-align: center;
      line-height: 300px;
      color: white;
      font-size: 20px;
      font-family: Arial, sans-serif;
    }

    /* When screen is 768px or smaller (tablets/phones) */
    @media (max-width: 768px) {
      .box {
        width: 200px;
        height: 200px;
        background-color: tomato;
        line-height: 200px;
        font-size: 16px;
      }
    }

    /* When screen is 480px or smaller (phones only) */
    @media (max-width: 480px) {
      .box {
        width: 120px;
        height: 120px;
        background-color: seagreen;
        line-height: 120px;
        font-size: 13px;
      }
    }

  </style>
</head>
<body>
  <div class="box">Resize Me!</div>
</body>
</html>
