<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Flexbox Demo</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 30px;
    }

    h2 {
        text-align: center;
    }

    .container {
        display: flex;

        /* Change these properties during the demo */
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;

        padding: 20px;
        border: 2px solid #333;
    }

    .box {
        width: 120px;
        height: 100px;
        background-color: steelblue;
        color: white;
        font-size: 24px;
        font-weight: bold;

        display: flex;
        justify-content: center;
        align-items: center;
    }
</style>
</head>

<body>

<h2>CSS Flexbox Demo</h2>

<div class="container">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
    <div class="box">6</div>
</div>

</body>
</html>
