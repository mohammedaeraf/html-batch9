<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <h2 class="text-center my-5">Contact Form</h2>
    <div class="row">
      <div class="col-lg-6 mx-auto">
        <form
          action="https://formspree.io/f/mwvzgzqq"
          method="post"
          class="rounded shadow p-5"
        >
          <div class="mb-3">
            <input
              type="text"
              name="fullName"
              id="fullName"
              class="form-control"
              placeholder="Enter your name"
            />
          </div>
          <div class="mb-3">
            <input
              type="email"
              name="email"
              id="email"
              placeholder="Enter your email"
              class="form-control"
            />
          </div>
          <div class="mb-3">
            <input
              type="text"
              name="subject"
              id="subject"
              placeholder="Enter your Subject"
              class="form-control"
            />
          </div>
          <div class="mb-3">
            <textarea
              name="message"
              id="message"
              class="form-control"
              rows="4"
              placeholder="Enter your Query or Message"
            ></textarea>
          </div>
          <div class="mb-3">
            <input
              type="submit"
              value="Send Message"
              class="btn btn-primary btn-lg"
            />
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
