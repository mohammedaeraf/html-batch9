<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anchors in HTML</title>
    <style>
      a {
        text-decoration: none;
        font-family: Arial, Helvetica, sans-serif;
      }
      /* Link States */
      a:link {
        color: darkgray;
      }
      a:visited {
        color: gray;
      }
      a:hover {
        color: red;
        /* text-decoration: underline; */
      }
    </style>
  </head>
  <body>
    <h1>Anchor Demo</h1>
    <a href="fonts.html" target="_blank">Go to Fonts</a>
    <br />
    <a href="new.html">New Page</a>
    <br />
    <a href="anotherpage.html">Another Page</a>
  </body>
</html>
