<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Image with Overlay</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .hero {
            background-image: url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3');
            background-size: cover;
            background-position: center;
            height: 500px;
        }

        .overlay {
            background-color: rgba(0, 0, 0, 0.6);
            height: 100%;
        }
    </style>
</head>

<body>

    <div class="hero">
        <div class="overlay text-center text-white pt-5">

            <h1 class="display-4 mt-5">
                Welcome to Future Leaders Academy
            </h1>

            <p class="lead">
                Learn Web Design, Python, React and more.
            </p>

            <a href="#" class="btn btn-primary">
                Explore Courses
            </a>

        </div>
    </div>

</body>

</html>
