<!DOCTYPE html>
<html>
<head>
    <title>Course Card</title>

    <style>

        .card{
            width:300px;
            border:1px solid gray;
            padding:15px;
            background-color:#f9f9f9;
        }

        .card img{
            width:100%;
        }

        .card h2{
            color:darkblue;
        }

        .btn{
            background-color:green;
            color:white;
            text-decoration:none;
            padding:8px;
        }

    </style>

</head>
<body>

    <div class="card">

        <img src="https://picsum.photos/300/150" alt="Course">

        <h2>Web Design Course</h2>

        <p>
            Learn HTML, CSS and Bootstrap from scratch.
        </p>

        <a href="#" class="btn">
            Enroll Now
        </a>

    </div>

</body>
</html>
