<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!-- First Bootstrap row: three equal-width columns on medium screens and larger -->
    <div class="row">
      <div class="bg-primary p-4 col-md-4 text-white fw-bold">Div 1</div>
      <div class="bg-danger p-4 col-md-4 text-white fw-bold">Div 2</div>
      <div class="bg-warning p-4 col-md-4 text-white fw-bold">Div 3</div>
    </div>

    <!-- Second Bootstrap row: four columns that split into two per row on medium screens, then four equal columns on large screens -->
    <div class="row">
      <div class="col-lg-3 col-md-6 bg-info text-white fw-bold p-4">Div 4</div>
      <div class="col-lg-3 col-md-6 bg-success text-white fw-bold p-4">
        Div 5
      </div>
      <div class="col-lg-3 col-md-6 bg-dark text-white fw-bold p-4">Div 4</div>
      <div class="col-lg-3 col-md-6 bg-secondary text-white fw-bold p-4">
        Div 5
      </div>
    </div>
  </body>
</html>
