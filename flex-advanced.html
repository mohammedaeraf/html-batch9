<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }
      .container {
        height: 600px;
        background-color: bisque;
        border: 2px solid brown;
        border-radius: 3px;
        /* Flexbox */
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: row;
        /* flex-wrap: wrap; */
        gap: 20px;
      }
      .box {
        font-size: 20px;
        font-weight: bold;
        height: 100px;
        border: 1px solid red;
        text-align: center;
        background-color: darkcyan;
        color: white;
        padding: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .box1 {
        /* flex-grow: 1;
        flex-shrink: 0;
        flex-basis: 250px; initial widht */

        flex: 1 0 250px;
      }
      .box2 {
        flex-basis: 250px;
        flex-shrink: 1;
        flex-grow: 3;
      }
      .box3 {
        flex-basis: 250px;
        flex-shrink: 1;
        flex-grow: 1;
      }
    </style>
  </head>
  <body>
    <h2>Flex Box</h2>
    <div class="container">
      <div class="box box1">Box 1</div>
      <div class="box box2">Box 2</div>
      <div class="box box3">Box 3</div>
    </div>
  </body>
</html>
