<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox Demo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .container-flex {
            display: flex;

            /* Change these during the demo */
            justify-content: flex-start;
            align-items: flex-start;
            flex-wrap: nowrap;
            gap: 0px;

            min-height: 450px;
        }

        .box {
            width: 120px;
            height: 100px;
        }
    </style>
</head>

<body>

    <div class="container mt-5">

        <h2 class="text-center mb-4">CSS Flexbox Demo</h2>

        <div class="container-flex border border-2 p-3">

            <div
                class="box bg-primary text-white rounded d-flex justify-content-center align-items-center fs-3 fw-bold">
                1
            </div>

            <div
                class="box bg-success text-white rounded d-flex justify-content-center align-items-center fs-3 fw-bold">
                2
            </div>

            <div class="box bg-warning rounded d-flex justify-content-center align-items-center fs-3 fw-bold">
                3
            </div>

            <div class="box bg-danger text-white rounded d-flex justify-content-center align-items-center fs-3 fw-bold">
                4
            </div>

            <div class="box bg-info rounded d-flex justify-content-center align-items-center fs-3 fw-bold">
                5
            </div>

            <div class="box bg-dark text-white rounded d-flex justify-content-center align-items-center fs-3 fw-bold">
                6
            </div>

        </div>

    </div>

</body>

</html>
