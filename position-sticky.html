<!DOCTYPE html>
<html>

<head>
    <style>
        .sticky-box {
            background: pink;
            padding: 10px;
            position: sticky;
            top: 0;
            /* sticks when reaching top */
        }

        .content {
            height: 1500px;
            /* scrollable content */
        }
    </style>
</head>

<body>
    <div class="sticky-box">Sticky Header</div>
    <div class="content">Scroll down to see sticky effect.</div>
</body>

</html>
