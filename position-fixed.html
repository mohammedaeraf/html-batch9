<!DOCTYPE html>
<html>
<head>
<style>
.fixed-box {
  width: 100%;
  background: orange;
  position: fixed;
  top: 0;   /* always at top */
  left: 0;
  text-align: center;
}
.content {
  margin-top: 60px;
  height: 2000px; /* to enable scrolling */
}
</style>
</head>
<body>
  <div class="fixed-box">Fixed Header</div>
  <div class="content">Scroll down to see header stays fixed.</div>
</body>
</html>
