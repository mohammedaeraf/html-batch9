<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table Demo</title>
    <style>
      body {
        font-family: Arial, Verdana, Tahoma;
      }
      table,
      th,
      td {
        border: 1px solid gray;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 6px;
      }
      th {
        background-color: rgb(237, 225, 243);
      }
    </style>
  </head>
  <body>
    <h2>List of Courses</h2>
    <table>
      <tr>
        <th>Course ID</th>
        <th>Title</th>
        <th>Duration</th>
        <th>Fee</th>
      </tr>
      <tr>
        <td>WD</td>
        <td>Web Design</td>
        <td>2.5 Months</td>
        <td>9800</td>
      </tr>
      <tr>
        <td>PY</td>
        <td>Python</td>
        <td>1.5 Months</td>
        <td>7000</td>
      </tr>
      <tr>
        <td>CNV</td>
        <td>Canva Graphic Design</td>
        <td>1.5 Months</td>
        <td>7000</td>
      </tr>
      <tr>
        <td>MERN</td>
        <td>Full Stack usign MERN</td>
        <td>5-6 Months</td>
        <td>25,000</td>
      </tr>
    </table>
  </body>
</html>
