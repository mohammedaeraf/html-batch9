<!DOCTYPE html>
<html>

<head>
    <style>
        .container {
            position: relative;
            width: 300px;
            height: 200px;
            background: lightgray;
        }

        .box {
            width: 100px;
            height: 100px;
            background: lightgreen;
            position: absolute;
            bottom: 10px;
            /* sticks to bottom */
            right: 10px;
            /* sticks to right */
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">Absolute</div>
    </div>
</body>

</html>
