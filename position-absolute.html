<!doctype html>
<html>
  <head>
    <style>
      .container {
        position: relative;
        width: 300px;
        height: 200px;
        background: lightgray;
      }

      .box {
        width: 100px;
        height: 100px;
        background: lightgreen;
        position: absolute;
        top: 10px;
        /* sticks to bottom */
        left: 10px;
        /* sticks to right */
      }
    </style>
  </head>

  <body>
    <h2>Absolute Positioning</h2>
    <div class="container">
      <div class="box">Absolute</div>
    </div>
  </body>
</html>
