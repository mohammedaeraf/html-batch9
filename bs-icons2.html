<!doctype html>
<html>
  <head>
    <title>Bootstrap Icons with Buttons</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <button>
      <i class="bi bi-download"></i>
      Download
    </button>

    <button>
      <i class="bi bi-pencil"></i>
      Edit
    </button>

    <button>
      <i class="bi bi-trash"></i>
      Delete
    </button>
  </body>
</html>
