<!DOCTYPE html>
<html>

<head>
    <title>Background Image with Overlay</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .hero-section {
            background-image: url("https://images.unsplash.com/photo-1516321318423-f06f85e504b3");
            background-size: cover;
            background-position: center;
            height: 500px;
        }

        .overlay {
            /* background-color: rgba(0, 0, 0, 0.6); */
            height: 500px;
            text-align: center;
            color: white;
            padding-top: 150px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        p {
            font-size: 20px;
            margin-bottom: 20px;
        }

        .btn {
            background-color: #ff4081;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="hero-section">
        <div class="overlay">
            <h1>Welcome to Future Leaders Academy</h1>
            <p>Learn Web Design, Python, React and more.</p>
            <a href="#" class="btn">Explore Courses</a>
        </div>
    </div>

</body>

</html>
